<linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#eef0ff"/><stop offset="1" stop-color="#f5f6fa"/>
</linearGradient>
</defs>
<rect width="1200" height="740" fill="url(#bgg)"/>
