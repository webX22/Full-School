<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:'Segoe UI',system-ui,sans-serif;fill:#1c2033}
.mut{fill:#6b7186;font-size:13px}
